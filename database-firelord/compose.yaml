services:
  firelord-logger:
    build: .
    container_name: firelord-logger
    environment:
      SERIAL_PORT: ${SERIAL_PORT:-/dev/ttyACM0}
      BAUD_RATE: ${BAUD_RATE:-115200}
      DB_PATH: /data/firelord.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RECONNECT_DELAY_SECONDS: ${RECONNECT_DELAY_SECONDS:-3}
    devices:
      - "${SERIAL_PORT:-/dev/ttyACM0}:${SERIAL_PORT:-/dev/ttyACM0}"
    volumes:
      - ./data:/data
    restart: unless-stopped
